name: Build SketchBook OSS APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Setup Gradle 8.7
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Prepare Release Keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ]; then
            python3 -c "
          import os, base64
          raw = os.environ.get('KEYSTORE_BASE64', '').strip().replace('\n', '').replace('\r', '').replace(' ', '')
          pad = len(raw) % 4
          if pad: raw += '=' * (4 - pad)
          with open('app/release-key.jks', 'wb') as f: f.write(base64.b64decode(raw))
          "
          else
            keytool -genkeypair -v -keystore app/release-key.jks -alias release -keyalg RSA -keysize 2048 -validity 10000 -storepass android123 -keypass android123 -dname "CN=SketchBookOSS, OU=Dev, O=OSS, L=City, S=State, C=US"
          fi

      - name: Build Release APK
        run: gradle assembleRelease

      - name: Upload APK to GitHub Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: SketchBookOSS-APK
          path: app/build/outputs/apk/release/app-release.apk
          retention-days: 7

      - name: Multi-Cloud File Uploads
        run: |
          APK_PATH="app/build/outputs/apk/release/app-release.apk"
          FINAL_APK_NAME="SketchBookOSS.apk"
          cp "$APK_PATH" "$FINAL_APK_NAME"

          echo "### 📱 Download Links for SketchBook OSS" >> $GITHUB_STEP_SUMMARY

          log_upload() {
            local service="$1"
            local url="$2"
            if [[ -n "$url" && "$url" =~ ^https?:// ]]; then
              echo "✅ $service: $url"
              echo "- **$service:** [$url]($url)" >> $GITHUB_STEP_SUMMARY
            else
              echo "❌ $service: Failed"
            fi
          }

          URL_CATBOX=$(curl -s -A "Mozilla/5.0" -F "reqtype=fileupload" -F "fileToUpload=@$FINAL_APK_NAME" https://catbox.moe/user/api.php 2>/dev/null || true)
          log_upload "Catbox.moe" "$URL_CATBOX"

          URL_LITTER=$(curl -s -A "Mozilla/5.0" -F "reqtype=fileupload" -F "time=72h" -F "fileToUpload=@$FINAL_APK_NAME" https://litterbox.catbox.moe/resources/internals/api.php 2>/dev/null || true)
          log_upload "Litterbox" "$URL_LITTER"

          URL_TEMP=$(curl -s -A "Mozilla/5.0" -F "file=@$FINAL_APK_NAME" https://temp.sh/upload 2>/dev/null || true)
          log_upload "Temp.sh" "$URL_TEMP"

          URL_TRANSFER=$(curl -s -A "Mozilla/5.0" -H "Content-Type: application/vnd.android.package-archive" --upload-file "$FINAL_APK_NAME" "https://transfer.sh/$FINAL_APK_NAME" 2>/dev/null || true)
          log_upload "Transfer.sh" "$URL_TRANSFER"

          URL_UGUU=$(curl -s -A "Mozilla/5.0" -F "files[]=@$FINAL_APK_NAME" "https://uguu.se/upload?output=text" 2>/dev/null || true)
          log_upload "Uguu.se" "$URL_UGUU"

          exit 0
