name: Build SketchBook OSS APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Setup Gradle 8.7
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Prepare Release Keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ]; then
            python3 -c "
          import os, base64
          raw = os.environ.get('KEYSTORE_BASE64', '').strip().replace('\n', '').replace('\r', '').replace(' ', '')
          pad = len(raw) % 4
          if pad: raw += '=' * (4 - pad)
          with open('app/release-key.jks', 'wb') as f: f.write(base64.b64decode(raw))
          "
          else
            keytool -genkeypair -v -keystore app/release-key.jks -alias release -keyalg RSA -keysize 2048 -validity 10000 -storepass android123 -keypass android123 -dname "CN=SketchBookOSS, OU=Dev, O=OSS, L=City, S=State, C=US"
          fi

      - name: Build Release APK
        run: gradle assembleRelease

      - name: Upload APK to GitHub Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: SketchBookOSS-APK
          path: app/build/outputs/apk/release/app-release.apk
          retention-days: 7

      - name: Upload APK to Cloud Hosts
        run: |
          APK_PATH="app/build/outputs/apk/release/app-release.apk"
          FINAL_APK="SketchBookOSS.apk"
          cp "$APK_PATH" "$FINAL_APK"
          echo "### 📱 Download SketchBook OSS APK" >> $GITHUB_STEP_SUMMARY

          URL_CATBOX=$(curl -s -A "Mozilla/5.0" -F "reqtype=fileupload" -F "fileToUpload=@$FINAL_APK" https://catbox.moe/user/api.php 2>/dev/null || true)
          [ -n "$URL_CATBOX" ] && echo "- **Catbox:** [$URL_CATBOX]($URL_CATBOX)" >> $GITHUB_STEP_SUMMARY

          URL_LITTER=$(curl -s -A "Mozilla/5.0" -F "reqtype=fileupload" -F "time=72h" -F "fileToUpload=@$FINAL_APK" https://litterbox.catbox.moe/resources/internals/api.php 2>/dev/null || true)
          [ -n "$URL_LITTER" ] && echo "- **Litterbox:** [$URL_LITTER]($URL_LITTER)" >> $GITHUB_STEP_SUMMARY

          URL_TEMP=$(curl -s -A "Mozilla/5.0" -F "file=@$FINAL_APK" https://temp.sh/upload 2>/dev/null || true)
          [ -n "$URL_TEMP" ] && echo "- **Temp.sh:** [$URL_TEMP]($URL_TEMP)" >> $GITHUB_STEP_SUMMARY

          URL_PIX=$(curl -s -A "Mozilla/5.0" -X PUT -T "$FINAL_APK" "https://pixeldrain.com/api/file/$FINAL_APK" 2>/dev/null | python3 -c "import sys, json; d=json.load(sys.stdin); print('https://pixeldrain.com/u/' + d['id']) if d.get('success') else ''" 2>/dev/null || true)
          [ -n "$URL_PIX" ] && echo "- **Pixeldrain:** [$URL_PIX]($URL_PIX)" >> $GITHUB_STEP_SUMMARY
